id = "hvp"
name = "HVP"
description = "HVP (Hierarchical Verification Plan) language support: diagnostics, completion, outline, folding via the hvp-language-server LSP, and syntax highlighting via tree-sitter-hvp."
version = "0.1.0"
schema_version = 1
authors = ["Ilia Barkov <barkovian@gmail.com>"]
repository = "https://github.com/Zvord/zed-hvp"

[language_servers.hvp]
name = "hvp-language-server"
languages = ["HVP"]

# `tree-sitter-hvp` now has a real remote (github.com/Zvord/tree-sitter-hvp); `rev` is
# that repo's current `main` HEAD (`git -C ../tree-sitter-hvp rev-parse origin/main`).
# Bump `rev` whenever tree-sitter-hvp's grammar changes.
[grammars.hvp]
repository = "https://github.com/Zvord/tree-sitter-hvp"
rev = "2cf51163cb887652b106879fba89d3f0c843a300"
